<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>itch link card</title>
<!-- The card link previews show (Discord, Twitter, ...), 1200x600: the sign, big enough to read on a
     phone, with the flyer over its corner, on the circuit background. itch takes a profile's preview
     image from the cover of the first project in its grid, so this is the cover of a placeholder project
     that the CSS hides. build.sh renders this to upload/card.png from the built images. -->
<style>
html, body { margin: 0; }
.card {
    position: relative; width: 1200px; height: 600px; overflow: hidden;
    background: #260a4b url(../upload/background.png) 50% 0 / 1280px; image-rendering: pixelated;
}
/* the sign is banner.html itself, scaled up as a page so its text stays sharp: its centre (490, 124)
   lands at (670, 300), centred top to bottom and a little right, to leave the flyer room */
.sign { position: absolute; left: 0; top: 0; width: 960px; height: 400px; border: 0;
    transform-origin: 0 0; transform: translate(-16px, 126px) scale(1.4); }
/* the flyer at 1.5x its sticker (3x the pixel art, so its pixels stay square), on the left */
.flyer { position: absolute; left: -10px; top: 190px; width: 357px; height: 249px; }
</style>
</head>
<body>
<div class="card">
  <iframe class="sign" src="banner.html"></iframe>
  <img class="flyer" src="../docs/flyer.png" alt="">
</div>
</body>
</html>
