<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>itch header: the sign</title>
<!-- The banner itch shows: only the neon sign, on a transparent 960x400 canvas. The floating
     sprites are profile CSS, drawn over it. build.sh renders this to upload/banner.png. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@700&family=Chakra+Petch:wght@600&display=swap">
<style>
html, body { margin: 0; background: transparent; }
.canvas { position: relative; width: 960px; height: 400px; overflow: hidden; }
.sign {
    position: absolute; left: 150px; top: 26px; width: 680px; height: 196px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transform: rotate(-2.5deg);
    padding-top: 26px; border: 8px solid #24133a; border-radius: 16px;
    background:
        linear-gradient(#3a1f5c, #2a1648) 0 0 / 100% 30px no-repeat,
        repeating-linear-gradient(180deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at 50% 45%, #2e1752, #120a22 85%);
    /* the outer soft shadow is kept small: it has to fade out inside the canvas */
    box-shadow: inset 0 0 50px rgba(0,0,0,.6), 0 0 0 2px #0d0616, 0 6px 0 2px #0d0616, 0 18px 30px rgba(0,0,0,.4);
}
.bar { position: absolute; top: 6px; left: 16px; right: 16px; display: flex; justify-content: space-between;
    font: 700 17px/1 "Pixelify Sans", sans-serif; letter-spacing: 2px; color: #c9b0ee; }
.bar i { width: 10px; height: 10px; margin-top: 3px; background: #ff6fae; box-shadow: -16px 0 0 #b48cf0, -32px 0 0 #6fe3a5; }
.name { font: 400 104px/1 "Jersey 10", sans-serif; letter-spacing: 3px; padding: 0 14px;
    color: #fff2fa; text-shadow: 0 0 18px rgba(255,111,174,.7), 0 4px 0 #d14081; }
.tag { margin-top: 10px; font: 600 19px/1 "Chakra Petch", sans-serif; letter-spacing: 1px; color: #c9b0ee; }
</style>
</head>
<body>
<div class="canvas">
  <div class="sign">
    <div class="bar"><span>HELLO.EXE</span><i></i></div>
    <div class="name">20akshay00</div>
    <div class="tag">computational physicist · game programmer</div>
  </div>
</div>
</body>
</html>
